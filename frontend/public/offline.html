<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PokéTracker</title>
<style>
  /* Everything inline and self-contained: this page is what loads when the
     network is unavailable, so it cannot fetch a stylesheet or a font. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    background: #378ADD;
    color: #fff;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
  p  { margin: 0; max-width: 20rem; line-height: 1.5; color: rgba(255,255,255,0.85); font-size: 0.95rem; }
  button {
    margin-top: 0.5rem;
    border: 0;
    border-radius: 0.875rem;
    padding: 0.85rem 2rem;
    /* 44px minimum touch target */
    min-height: 44px;
    background: #fff;
    color: #1E3A8A;
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="#fff" stroke="#1f2937" stroke-width="6"/>
    <path d="M4 50a46 46 0 0 1 92 0z" fill="#ef4444" stroke="#1f2937" stroke-width="6"/>
    <line x1="4" y1="50" x2="96" y2="50" stroke="#1f2937" stroke-width="6"/>
    <circle cx="50" cy="50" r="14" fill="#fff" stroke="#1f2937" stroke-width="6"/>
  </svg>
  <h1>Can&rsquo;t reach PokéTracker</h1>
  <p>Your collection is safe &mdash; it lives on the server, not on this phone. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
