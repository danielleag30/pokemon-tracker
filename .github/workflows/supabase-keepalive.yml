name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 08:00 UTC — prevents Supabase free-tier 7-day pause
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wmwpjkfgapqyyjsjuhos.supabase.co/functions/v1/cards/sets")
          echo "Status: $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
