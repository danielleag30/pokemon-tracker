name: Supabase Backup

# Nightly encrypted backup of the irreplaceable tables.
#
# Why encrypted: this repo is public, and on a public repo anyone can download
# workflow artifacts. profiles.real_email holds parent email addresses for child
# accounts, so the dump is GPG-encrypted before it ever becomes an artifact.
#
# What's excluded: cards_vectors, *_cache and ingest_queue are regenerable from
# the Pokemon TCG API via the ingest pipeline (134 MB of embeddings we'd only be
# paying to store twice). Schema lives in supabase/migrations/, already in git.

on:
  schedule:
    # Nightly at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

env:
  PGHOST: aws-1-us-west-2.pooler.supabase.com
  PGPORT: '5432'
  PGUSER: postgres.wmwpjkfgapqyyjsjuhos
  PGDATABASE: postgres

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # The runner ships an older client; pg_dump refuses to run against a
      # newer server, and Supabase is on Postgres 17.
      - name: Install postgresql-client-17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump data
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          STAMP="$(date -u +%Y%m%d-%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

          pg_dump \
            --no-owner --no-privileges --no-comments \
            --table=public.collection \
            --table=public.profiles \
            --table=public.chat_logs \
            --table=public.chat_feedback \
            --table=public.general_feedback \
            --file="out/poketracker-$STAMP.sql"

          ls -lh "out/poketracker-$STAMP.sql"

      # A backup that silently contains zero rows is worse than no backup,
      # because it looks fine on the Actions tab. Compare the dump against
      # the live table before trusting it.
      - name: Verify the dump actually contains the collection
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          FILE="out/poketracker-$STAMP.sql"

          LIVE=$(psql -At -c 'select count(*) from public.collection')
          DUMPED=$(awk '/^COPY public\.collection /{f=1;next} f&&/^\\\.$/{f=0} f' "$FILE" | wc -l | tr -d ' ')

          echo "live rows: $LIVE / rows in dump: $DUMPED"

          if [ "$LIVE" -eq 0 ]; then
            echo "::error::Live collection table is empty - refusing to publish this backup."
            exit 1
          fi
          if [ "$LIVE" != "$DUMPED" ]; then
            echo "::error::Row count mismatch (live $LIVE vs dumped $DUMPED)."
            exit 1
          fi

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set - refusing to upload a plaintext dump."
            exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-fd 0 \
              --output "out/poketracker-$STAMP.sql.gpg" \
              "out/poketracker-$STAMP.sql" <<< "$PASSPHRASE"
          # Make sure the plaintext cannot reach the artifact.
          shred -u "out/poketracker-$STAMP.sql" 2>/dev/null || rm -f "out/poketracker-$STAMP.sql"
          ls -lh out/

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: poketracker-backup-${{ env.STAMP }}
          path: out/*.sql.gpg
          retention-days: 90
          if-no-files-found: error
