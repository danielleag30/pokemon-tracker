name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref wmwpjkfgapqyyjsjuhos --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions
        run: |
          # --yes is required: newer CLI versions ask for confirmation before
          # deploying to a production project, and a prompt that cannot be
          # shown ("stdout is not a terminal") fails the step outright.
          supabase functions deploy collection   --no-verify-jwt --yes
          supabase functions deploy cards        --no-verify-jwt --yes
          supabase functions deploy chat         --no-verify-jwt --yes
          supabase functions deploy admin        --no-verify-jwt --yes
          supabase functions deploy ingest-cards --no-verify-jwt --yes
          supabase functions deploy ingest-check --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
